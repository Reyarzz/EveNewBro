# Builds Windows + macOS installers and attaches them to a GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Verify build prerequisites
        run: node scripts/check-build.js

      - name: Clear winCodeSign cache (Windows CI symlink workaround)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA 'electron-builder\Cache\winCodeSign'
          if (Test-Path $cache) { Remove-Item -Recurse -Force $cache }

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''

      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CI: true

      - name: List build output
        shell: bash
        run: ls -laR dist

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dist-*
          merge-multiple: true

      - name: Flatten release files
        run: |
          mkdir -p release-flat
          find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp -v {} release-flat/ \;
          count=$(find release-flat -type f \( -name '*.exe' -o -name '*.dmg' \) | wc -l)
          echo "Found $count installer(s)"
          ls -la release-flat
          if [ "$count" -eq 0 ]; then
            echo "::error::No installer files found. Check the build job logs."
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            v=$(node -p "require('./package.json').version")
            echo "tag=v${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: EVE NewBro ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: release-flat/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

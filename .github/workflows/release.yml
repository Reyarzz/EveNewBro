# Builds the Windows installer and attaches it to a GitHub Release.
# Players download the .exe — no Node.js or build.bat required.
#
# Maintainer: tag a version and push — CI does the rest.
#   git tag v0.2.1
#   git push origin v0.2.1
# Or run this workflow manually from the Actions tab (uses package.json version).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List build output
        run: dir dist

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $t = "${{ github.ref_name }}"
          } else {
            $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $t = "v$v"
          }
          "tag=$t" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $t"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: EVE NewBro ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/EVE-NewBro-Setup-*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
